<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/assets/global.css">
    <script src="/assets/scripts/courts-data.js"></script>
    <script type="module" src="/assets/scripts/header.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <title>Đăng nhập</title>
</head>
<body>
    <header class="header">
        <a class="header__logo" href="/"><img class="header__logo-img" draggable="false" src="/assets/images/logo.png" alt="Logo"></a>
        <button class="header__menu-btn" id="menu">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-solid fa-x" style="display: none;"></i>
        </button>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="/">Trang chủ</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="/lich-su-dat">Lịch sử đặt</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="/ve-chung-toi">Về chúng tôi</a>
                </li>
            </ul>
        </nav>

        <a class="login-btn" href="/dang-nhap">Đăng nhập</a>
        <div class="user-info">
            <h5>Hoàng Văn A</h5>
            <img height="32px" src="/assets/images/user-icon.webp" draggable="false">
        </div>
    </header>

    <nav class="nav-mobile">
        <ul class="nav-mobile__list">
            <li class="nav__item">
                <a class="nav__link" href="/">Trang chủ</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/lich-su-dat">Lịch sử đặt</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/ve-chung-toi">Về chúng tôi</a>
            </li>

            <div class="user-info">
                <h5>Hoàng Văn A</h5>
                <img height="32px" src="/assets/images/user-icon.webp" draggable="false">
            </div>

            <a class="login-btn" href="/">Đăng nhập</a>
        </ul>
    </nav>
    
    <main>
        <h1>Login</h1>
        <form class="Login__form">
            <label for="numberPhone">SĐT Đăng nhập:</label>
            <input class="Login__form--input" type="text" id="numberPhone">
            <label for="passowrd">Password:</label>
            <input class="Login__form--input" type="password" id="password">
            <a class="Login__form--forgot" href="/">Forgot password?</a>
            <p class="Login__form--status"></p>
            <input class="Login__form--submit" type="submit" value="Login">
            <a class="Register" href="../dang-ky/index.html">Create new account?</a>
        </form>
        <script src="scripts/authenticate.js"></script>
    </main>
    <footer class="footer">
        © 2026 - Nhóm 5
    </footer>
</body>
</html>
