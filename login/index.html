<!DOCTYPE html>
<html lang="vi">
<head>

    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">

</head>
<body>
    <header>
        <a href="/"><img draggable="false" class="logo" src="/assets/images/logo.png" alt="Logo"></a>
        <button id="menu">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-solid fa-x" style="display: none;"></i>
        </button>
        <nav>
            <ul>
                <li class="active">

            <h5>Hoàng Văn A</h5>

    <main>
        <h1>Login</h1>
        <form class="Login__form">
            <label for="numberPhone">SĐT Đăng nhập:</label>

            <a class="Login__form--forgot" href="/">Forgot password?</a>
            <p class="Login__form--status"></p>
            <input class="Login__form--submit" type="submit" value="Login">
            <a class="Register" href="../dang-ky/index.html">Create new account?</a>

        <script src="scripts/authenticate.js"></script>

    <footer>
