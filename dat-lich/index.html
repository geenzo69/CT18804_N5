<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/assets/global.css">
    <script src="/assets/scripts/courts-data.js"></script>
    <script type="module" src="scripts/loader.js" blocking="render"></script>
    <script type="module" src="/assets/scripts/header.js" blocking="render"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <title>Đặt lịch - BadmintonPlus</title>
</head>

<body>
    <header class="header">
        <a class="header__logo" href="/"><img class="header__logo-img" draggable="false" src="/assets/images/logo.png"
                alt="Logo"></a>
        <button class="header__menu-btn" id="menu">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-solid fa-x" style="display: none;"></i>
        </button>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="/">Trang chủ</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="/lich-su-dat">Lịch sử đặt</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="/gioi-thieu">Giới thiệu</a>
                </li>
            </ul>
        </nav>

        <a class="login-btn" href="/dang-nhap">Đăng nhập</a>
        <div class="user-info">
            <h5>Hoàng Văn A</h5>
            <img height="32px" src="/assets/images/user-icon.webp" draggable="false">
        </div>
    </header>

    <nav class="nav-mobile">
        <ul class="nav-mobile__list">
            <li class="nav__item">
                <a class="nav__link" href="/">Trang chủ</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/lich-su-dat">Lịch sử đặt</a>
            </li>
            <li class="nav__item">
                <a class="nav__link" href="/gioi-thieu">Giới thiệu</a>
            </li>

            <div class="user-info">
                <h5>Hoàng Văn A</h5>
                <img height="32px" src="/assets/images/user-icon.webp" draggable="false">
            </div>

            <a class="login-btn" href="/dang-nhap">Đăng nhập</a>
        </ul>
    </nav>

    <main>
        <div class="box">
            <h2>Đặt lịch sân cầu lông</h2>

            <form id="bookingForm">
                <label for="court">Chọn sân:</label>
                <select id="court"></select>
                <p id="courtInfo" class="info"></p>

                <label>Ngày đặt:</label>
                <div class="date-row">
                    <input type="number" id="day" placeholder="Ngày" min="1" max="31" required>
                    <input type="number" id="month" placeholder="Tháng" min="1" max="12" required>
                    <input type="number" id="year" placeholder="Năm" min="2026" required>
                </div>

                <label for="slot">Khung giờ:</label>
                <select id="slot"></select>

                <p class="total">Giá: <span id="price">0</span>đ</p>

                <button type="submit" id="btnBook">Đặt lịch</button>
                <p id="message"></p>
            </form>
        </div>
    </main>

    <footer class="footer">
        © 2026 - Nhóm 5
    </footer>
    <script src="script.js"></script>
</body>

</html>
