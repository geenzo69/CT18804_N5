<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/assets/global.css">
    <script type="module" src="scripts/loader.js" blocking="render"></script>
    <script type="module" src="/assets/scripts/header.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <title>Đặt lịch - BadmintonPlus</title>
</head>

<body>
    <header>
        <a href="/"><img draggable="false" class="logo" src="/assets/images/logo.png" alt="Logo"></a>
        <button id="menu">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-solid fa-x" style="display: none;"></i>
        </button>
        <nav>
            <ul>
                <li>
                    <a href="/">Trang chủ</a>
                </li>
                <li>
                    <a href="/lich-su-dat">Lịch sử đặt</a>
                </li>
                <li>
                    <a href="/ve-chung-toi">Về chúng tôi</a>
                </li>
            </ul>
        </nav>

        <a class="login-btn" href="/">Đăng nhập</a>
        <div class="user-menu">
            <h5>Hoàng Văn A</h5>
            <img height="32px" src="https://avatars.githubusercontent.com/u/107747605?v=4">
        </div>
    </header>

    <nav class="mobile">
        <ul>
            <li>
                <a href="/">Trang chủ</a>
            </li>
            <li>
                <a href="/lich-su-dat">Lịch sử đặt</a>
            </li>
            <li>
                <a href="/ve-chung-toi">Về chúng tôi</a>
            </li>

            <div class="user-menu">
                <h5>Hoàng Văn A</h5>
                <img height="32px" src="https://avatars.githubusercontent.com/u/107747605?v=4">
            </div>

            <a class="login-btn" href="/">Đăng nhập</a>
        </ul>
    </nav>

    <main>
  <div class="box">
    <h2>Đặt lịch sân cầu lông</h2>

    <label>Chọn sân:</label>
    <select id="court"></select>
    <p id="courtInfo" class="info"></p>

    <label>Ngày đặt:</label>
    <div class="date-row">
      <input type="number" id="day" placeholder="Ngày">
      <input type="number" id="month" placeholder="Tháng">
      <input type="number" id="year" placeholder="Năm">
    </div>

    <label>Khung giờ:</label>
    <select id="slot"></select>

    <p class="total">Giá: <span id="price">0</span>đ</p>

    <button id="btnBook">Đặt lịch</button>
    <p id="message"></p>
  </div>
    </main>

    <footer>
        © 2026 - Nhóm 5
    </footer>
    <script type="module" src="script.js"></script>
</body>

</html>
